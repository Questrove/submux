name: submux Release

on:
  push:
    tags: ['submux-v*']

concurrency:
  group: submux-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
      - name: Validate tag and source
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^submux-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${GITHUB_REF_NAME#submux-}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          go vet ./...
          go test ./... -count=1
          bash -n scripts/*.sh
          find packaging -type f -name '*.sh' -print0 | xargs -0 bash -n
          bash scripts/test-installers.sh
      - name: Build control-plane binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build_date="$(git show -s --format=%cI HEAD)"
          ldflags="-s -w -X submux/internal/buildinfo.Version=${VERSION} -X submux/internal/buildinfo.Commit=${COMMIT} -X submux/internal/buildinfo.Date=${build_date}"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              suffix=
              if [ "$os" = windows ]; then suffix=.exe; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -trimpath -buildvcs=false -ldflags="$ldflags" \
                -o "dist/submux-${os}-${arch}${suffix}" ./cmd/submux
            done
          done
          ./dist/submux-linux-amd64 --version | grep -F " ${VERSION} ("
          install -m 0755 scripts/install.sh dist/install-submux.sh
      - uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/SBOM.spdx.json
          upload-artifact: false
      - name: Validate and checksum assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name 'submux-*' | wc -l)" -eq 6
          (
            cd dist
            sha256sum SBOM.spdx.json install-submux.sh submux-* > checksums.txt
            sha256sum -c checksums.txt
          )
          go run ./cmd/submux-release-check scan \
            --dir "$(pwd)/dist" --policy release/runtime-release-policy.json
      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          cat > RELEASE-NOTES.md <<EOF
          # submux ${VERSION}

          This is the stable submux control-plane release.

          - Removes the legacy remote Agent, enrollment, heartbeat and remote-job control surfaces.
          - Keeps Runtime local-only: submux publishes configuration; Runtime independently manages one local Mihomo.
          - Improves durable output publication, deletion validation and consistent console snapshots.
          - Adds a built-in installation, operation, backup and uninstall guide for the redesigned Runtime TUI.
          - Provides static Linux, macOS and Windows binaries for amd64 and arm64.
          - Includes install-submux.sh for verified online or transferred offline service installation.

          Submux Runtime remains a separate product with its own \`vX.Y.Z\` release channel and support status.

          Verify downloads with \`checksums.txt\` and GitHub Artifact Attestations.
          EOF
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(
            gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null ||
              true
          )
          args=(--title "submux ${VERSION}" --notes-file RELEASE-NOTES.md --prerelease=false --latest)
          if [ "$existing" = false ]; then
            echo "release is already public; refusing to mutate immutable assets" >&2
            exit 1
          elif [ "$existing" = true ]; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft --verify-tag "${args[@]}"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
