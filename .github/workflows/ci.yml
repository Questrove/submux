name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Linux Runtime network namespaces
        run: |
          sudo apt-get update
          sudo apt-get install --yes nftables
          sudo modprobe tun
          go test -c -o /tmp/submux-runtimenet.test ./internal/runtimenet
          sudo env SUBMUX_RUN_PRIVILEGED_NETNS_TESTS=1 \
            /tmp/submux-runtimenet.test \
            -test.v \
            -test.run '^TestLinuxNetworkNamespace(OrdinaryTUN|Gateway|GatewaySingleArm)$'

      - name: Build (static, CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /tmp/submux ./cmd/submux

      - name: Installer syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/test-installers.sh
          bash scripts/test-installers.sh
