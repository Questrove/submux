name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build (static, CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /tmp/submux ./cmd/submux

      - name: Installer syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/test-installers.sh
          bash scripts/test-installers.sh
